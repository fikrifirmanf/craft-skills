name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate shell entrypoint
        run: bash -n install.sh
      - name: Validate skill names and discovery
        run: ./install.sh --list
      - name: Check installer behavior
        run: python3 -B -m unittest discover -s tests -v
      - name: Check rich-ui scripts
        run: python3 -B -m unittest discover -s skills/rich-ui/tests -v
      - name: Check architecture-unslop scripts
        run: python3 -B -m unittest discover -s skills/architecture-unslop/tests -v
      - name: Validate full design example
        run: python3 -B skills/rich-ui/scripts/lint_design_md.py skills/rich-ui/assets/examples/harbor-ledger.design.md
